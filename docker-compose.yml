services:
  postgres:
    image: postgres:16-alpine
    container_name: marketplace_postgres
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace
    ports:
      # 5433 en el host porque el 5432 lo ocupa tu PostgreSQL local de Windows.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: marketplace_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: marketplace_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Consola web (http://localhost:9001)
    volumes:
      - minio_data:/data

  # Buzón de correo de desarrollo: la API le entrega los correos por SMTP (1025) y se leen en la
  # interfaz web (http://localhost:8025). No envía nada a Internet.
  mailpit:
    image: axllent/mailpit:latest
    container_name: marketplace_mailpit
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
    ports:
      - "1025:1025"   # SMTP (SMTP_HOST/SMTP_PORT de la API en desarrollo)
      - "8025:8025"   # Interfaz web (http://localhost:8025)
    volumes:
      - mailpit_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
  mailpit_data:
